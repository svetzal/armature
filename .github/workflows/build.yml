name: Validate and publish

on:
  push:
    branches: ["main"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.5"
          otp-version: "28.5.0.7"

      - name: Cache dependencies and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run Credo
        run: mix credo --strict

      - name: Run tests with coverage
        run: mix test --cover

      - name: Audit dependencies
        run: mix deps.audit

      - name: Build documentation
        run: mix docs

  publish-hex:
    needs: validate
    # Publishing happens only when a GitHub release is published.
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.5"
          otp-version: "28.5.0.7"

      - name: Install dependencies
        run: mix deps.get

      - name: Check the release tag matches the version
        run: |
          version=$(grep -m1 '@version' mix.exs | cut -d'"' -f2)
          test "v$version" = "${{ github.event.release.tag_name }}"

      # Hex reads HEX_API_KEY from the environment; the key is never written to disk.
      - name: Publish to Hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
